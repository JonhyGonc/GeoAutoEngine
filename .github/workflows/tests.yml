name: Full test suite

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  all-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run all tests (no filter)
        run: >-
          dotnet test tests/GeoAutoEngine.Tests/GeoAutoEngine.Tests.csproj
          --configuration Release
