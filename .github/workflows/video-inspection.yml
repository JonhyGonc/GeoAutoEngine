name: Video inspection

on:
  pull_request:
    paths:
      - ".github/workflows/video-inspection.yml"
      - "src/GeoAutoEngine.Application/VideoInspection/**"
      - "tests/GeoAutoEngine.Tests/VideoInspectionTests.cs"
      - "tests/GeoAutoEngine.Tests/InspectionCorrectionTests.cs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/video-inspection.yml"
      - "src/GeoAutoEngine.Application/VideoInspection/**"
      - "tests/GeoAutoEngine.Tests/VideoInspectionTests.cs"
      - "tests/GeoAutoEngine.Tests/InspectionCorrectionTests.cs"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run video inspection tests
        run: >-
          dotnet test tests/GeoAutoEngine.Tests/GeoAutoEngine.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~VideoInspection|FullyQualifiedName~InspectionCorrection|FullyQualifiedName~LinearReference|FullyQualifiedName~InspectionPipe"
